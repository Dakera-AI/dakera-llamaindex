name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ contains(github.event.pull_request.labels.*.name, 'full-matrix') && fromJson('["3.10","3.11","3.12"]') || fromJson('["3.10","3.12"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports

      - name: Security audit
        run: |
          pip install --upgrade pip setuptools
          # PYSEC-2026-3740 (CVE-2026-81726): nltk path traversal in its model-artifact
          # APIs; no fixed nltk release exists yet (3.10.3 is the latest). nltk comes in
          # through llama-index-core and this package never calls those APIs. Drop the
          # ignore once a fixed nltk is published.
          pip-audit --ignore-vuln CVE-2026-3219 --ignore-vuln PYSEC-2026-3740

      - name: Test with pytest
        run: pytest tests/ -v --tb=short
